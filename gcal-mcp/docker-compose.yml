# ===========================================
# Google Calendar MCP Server - Docker Compose
# ===========================================

version: '3.8'

services:
  gcal-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gcal-mcp-server
    restart: on-failure

    ports:
      - "8020:8000"

    volumes:
      # 挂载项目根目录下的共享凭证子目录（见 /config/README.md）
      - ../config/gcal:/config

    env_file:
      - .env
    environment:
      - GCAL_CREDS_DIR=/config
      - PORT=8000

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
