# ===========================================
# MCP 服务反向代理（gdrive-mcp + gcal-mcp）
# 宿主机端口：gdrive 8010，gcal 8020
# 对外路径：/gdrive-mcp/、/gcal-mcp/
# ===========================================
# 用法：在 server { } 内 include 此文件，例如：
#   server { listen 80; server_name 18.217.236.127;
#     include /path/to/MCP-Service/config/nginx/mcp.conf;
#   }
# ===========================================

    location /gdrive-mcp/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    location /gcal-mcp/ {
        proxy_pass http://127.0.0.1:8020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
